[project]
name = "rdc-scraper"
version = "0.1.0"
description = "RDC Scraper - Beverage price scraper for Chilean e-commerce (Python 3.14, AWS SAM)"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/layers/*", "src/spiders/*", "src/pipeline/*"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
