AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RDC Scraper - Beverage price scraper for Chilean e-commerce (Python 3.14)

# ---------------------------------------------------------------------------
# Fase 0 — andamiaje: solo bucket de imágenes + Lambda Layer compartida (vacía).
# Las Lambdas del pipeline y la state machine se agregan en fases posteriores.
# Convención de nombres: RDCScraper-[Nombre] (ver PLAN.md §8.1).
# ---------------------------------------------------------------------------

Parameters:
  S3ImagesBucket:
    Type: String
    Description: S3 bucket name for product images
    Default: rincon-del-curao

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64

Resources:
  ########################################
  # S3 BUCKET - PRODUCT IMAGES
  ########################################

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3ImagesBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ProductImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${S3ImagesBucket}/images/*'

  ########################################
  # SHARED LAMBDA LAYER
  ########################################

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: RDCScraper-SharedLayer
      Description: Shared code (fetchers, standard_format, mongo, naming/mappings)
      ContentUri: src/shared/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64

Outputs:
  ProductImagesBucketName:
    Description: S3 bucket for product images
    Value: !Ref ProductImagesBucket
  SharedLayerArn:
    Description: Shared Lambda Layer ARN
    Value: !Ref SharedLayer
