AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RDC Scraper - Beverage price scraper for Chilean e-commerce (Python 3.14)

# ---------------------------------------------------------------------------
# Fase 1 — bucket de imágenes + dos Lambda Layers compartidas (utils, database).
# Las Lambdas del pipeline y la state machine se agregan en fases posteriores.
# Convención de nombres: RDCScraper-[Nombre] (ver PLAN.md §8.1).
# ---------------------------------------------------------------------------

Parameters:
  S3ImagesBucket:
    Type: String
    Description: S3 bucket name for product images
    Default: rincon-del-curao

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - x86_64

Resources:
  ########################################
  # S3 BUCKET - PRODUCT IMAGES
  ########################################

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3ImagesBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ProductImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${S3ImagesBucket}/images/*'

  ########################################
  # SHARED LAMBDA LAYERS
  #   utils     → fetchers, standard_format, naming, mappings (aiohttp, bs4)
  #   database  → acceso a Mongo Atlas (pymongo[srv]); depende de utils
  ########################################

  UtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: RDCScraper-UtilsLayer
      Description: Utils (fetchers, standard_format, naming, mappings)
      ContentUri: src/layers/utils/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - x86_64
    Metadata:
      BuildMethod: makefile

  DatabaseLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: RDCScraper-DatabaseLayer
      Description: MongoDB Atlas access (client, infos, products, price_logs). Requires UtilsLayer.
      ContentUri: src/layers/database/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - x86_64
    Metadata:
      BuildMethod: makefile

  ########################################
  # SPIDERS (una Lambda independiente por sitio; solo adjuntan UtilsLayer)
  ########################################

  SpiderJumboFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-SpiderJumboFunction
      Description: Scrapea Jumbo (PLP -> PDP) y sube el run JSON a S3.
      CodeUri: src/spiders/jumbo/
      Handler: handler.handler
      Timeout: 300
      MemorySize: 512
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          S3_PIPELINE_BUCKET: !Ref S3ImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${S3ImagesBucket}/pipeline/*'

  ########################################
  # PIPELINE — MergeResults
  #   Carga los runs del Parallel, dedup por url, agrupa por categoria, batches de 250.
  #   Solo stdlib + boto3 (runtime) -> sin layers.
  ########################################

  MergeResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineMergeResultsFunction
      Description: Consolida los runs de spiders, dedup por url, agrupa por categoria y escribe batches en S3.
      CodeUri: src/pipeline/merge_results/
      Handler: handler.handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          S3_PIPELINE_BUCKET: !Ref S3ImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub 'arn:aws:s3:::${S3ImagesBucket}/pipeline/*'

  ########################################
  # STEP FUNCTIONS — orquestador
  #   Fase 3: ScrapeParallel -> MergeResults.
  ########################################

  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: RDCScraper-OrchestratorRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSpiders
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt SpiderJumboFunction.Arn
                  - !GetAtt MergeResultsFunction.Arn

  OrchestratorStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: RDCScraper-Orchestrator
      Type: STANDARD
      Role: !GetAtt OrchestratorRole.Arn
      Definition:
        Comment: RDC Scraper orchestrator (Fase 3 — ScrapeParallel -> MergeResults)
        StartAt: ScrapeParallel
        States:
          ScrapeParallel:
            Type: Parallel
            ResultPath: $.s3_keys
            Next: MergeResults
            Branches:
              - StartAt: InvokeSpiderJumbo
                States:
                  InvokeSpiderJumbo:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Parameters:
                      FunctionName: !Ref SpiderJumboFunction
                      Payload:
                        execution_id.$: $$.Execution.Name
                    ResultSelector:
                      s3_key.$: $.Payload.s3_key
                      count.$: $.Payload.count
                    End: true
          MergeResults:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !Ref MergeResultsFunction
              Payload:
                s3_keys.$: $.s3_keys
                execution_id.$: $$.Execution.Name
            ResultSelector:
              batches.$: $.Payload
            End: true

Outputs:
  ProductImagesBucketName:
    Description: S3 bucket for product images
    Value: !Ref ProductImagesBucket
  UtilsLayerArn:
    Description: Utils Lambda Layer ARN
    Value: !Ref UtilsLayer
  DatabaseLayerArn:
    Description: Database Lambda Layer ARN
    Value: !Ref DatabaseLayer
  SpiderJumboFunctionArn:
    Description: Jumbo spider Lambda ARN
    Value: !GetAtt SpiderJumboFunction.Arn
  MergeResultsFunctionArn:
    Description: MergeResults pipeline Lambda ARN
    Value: !GetAtt MergeResultsFunction.Arn
  OrchestratorArn:
    Description: Step Functions orchestrator ARN
    Value: !Ref OrchestratorStateMachine
