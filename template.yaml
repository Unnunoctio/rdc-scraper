AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RDC Scraper - Beverage price scraper for Chilean e-commerce (Python 3.14)

# ---------------------------------------------------------------------------
# Fase 1 — bucket de imágenes + dos Lambda Layers compartidas (utils, database).
# Las Lambdas del pipeline y la state machine se agregan en fases posteriores.
# Convención de nombres: RDCScraper-[Nombre] (ver PLAN.md §8.1).
# ---------------------------------------------------------------------------

Parameters:
  S3ImagesBucket:
    Type: String
    Description: S3 bucket name for product images
    Default: rincon-del-curao

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64

Resources:
  ########################################
  # S3 BUCKET - PRODUCT IMAGES
  ########################################

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3ImagesBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ProductImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${S3ImagesBucket}/images/*'

  ########################################
  # SHARED LAMBDA LAYERS
  #   utils     → fetchers, standard_format, naming, mappings (aiohttp, bs4)
  #   database  → acceso a Mongo Atlas (pymongo[srv]); depende de utils
  ########################################

  UtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: RDCScraper-UtilsLayer
      Description: Utils (fetchers, standard_format, naming, mappings)
      ContentUri: src/layers/utils/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64

  DatabaseLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: RDCScraper-DatabaseLayer
      Description: MongoDB Atlas access (client, infos, products, price_logs). Requires UtilsLayer.
      ContentUri: src/layers/database/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64

Outputs:
  ProductImagesBucketName:
    Description: S3 bucket for product images
    Value: !Ref ProductImagesBucket
  UtilsLayerArn:
    Description: Utils Lambda Layer ARN
    Value: !Ref UtilsLayer
  DatabaseLayerArn:
    Description: Database Lambda Layer ARN
    Value: !Ref DatabaseLayer
