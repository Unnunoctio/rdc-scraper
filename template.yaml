AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  MongoDbUri:
    Type: String
    NoEcho: true
  MongoDbDatabase:
    Type: String
  S3ImagesBucket:
    Type: String
    Default: rincon-del-curao
  DrinksApiUrl:
    Type: String
    Default: ''
  DrinksApiKey:
    Type: String
    Default: ''
    NoEcho: true
  ProxyEndpoint:
    Type: String
    Default: ''
  ProxyApiKey:
    Type: String
    Default: ''
    NoEcho: true
  ResendApiKey:
    Type: String
    Default: ''
    NoEcho: true
  EmailSender:
    Type: String
    Default: ''
  EmailRecipient:
    Type: String
    Default: ''

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64

Resources:
  # ── DynamoDB ──────────────────────────────────────────────────────────────

  SpiderConfigsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RDCScraper-SpiderConfigsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # ── S3 ────────────────────────────────────────────────────────────────────

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3ImagesBucket

  ProductImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductImagesBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${S3ImagesBucket}/images/*'

  # ── Lambdas ───────────────────────────────────────────────────────────────

  PipelineLoadConfigsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineLoadConfigsFunction
      CodeUri: src/pipeline/load-configs/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB: !Ref MongoDbDatabase
          SPIDER_CONFIGS_TABLE: !Ref SpiderConfigsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SpiderConfigsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handler.ts

  SpiderJumboFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-SpiderJumboFunction
      CodeUri: src/spiders/jumbo/
      Handler: handler.handler
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          S3_BUCKET: !Ref S3ImagesBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref S3ImagesBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handler.ts

  PipelineMergeResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineMergeResultsFunction
      CodeUri: src/pipeline/merge-results/
      Handler: handler.handler
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          S3_BUCKET: !Ref S3ImagesBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3ImagesBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handler.ts

  PipelineFindByPathFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineFindByPathFunction
      CodeUri: src/pipeline/find-by-path/
      Handler: handler.handler
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB: !Ref MongoDbDatabase
          S3_BUCKET: !Ref S3ImagesBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3ImagesBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handler.ts

  PipelineSearchDrinksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineSearchDrinksFunction
      CodeUri: src/pipeline/search-drinks/
      Handler: handler.handler
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          DRINKS_API_URL: !Ref DrinksApiUrl
          DRINKS_API_KEY: !Ref DrinksApiKey
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handler.ts

  PipelineSyncProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineSyncProductFunction
      CodeUri: src/pipeline/sync-product/
      Handler: handler.handler
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB: !Ref MongoDbDatabase
          S3_BUCKET: !Ref S3ImagesBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref S3ImagesBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handler.ts
        External:
          - sharp

  PipelineMarkOutOfStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineMarkOutOfStockFunction
      CodeUri: src/pipeline/mark-out-of-stock/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB: !Ref MongoDbDatabase
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handler.ts

  # PipelineSendReportFunction:
  #   Type: AWS::Serverless::Function
  #   Properties:
  #     FunctionName: RDCScraper-PipelineSendReportFunction
  #     CodeUri: src/pipeline/send-report/
  #     Handler: handler.handler
  #     MemorySize: 256
  #     Timeout: 60
  #     Environment:
  #       Variables:
  #         RESEND_API_KEY: !Ref ResendApiKey
  #         EMAIL_SENDER: !Ref EmailSender
  #         EMAIL_RECIPIENT: !Ref EmailRecipient
  #   Metadata:
  #     BuildMethod: esbuild
  #     BuildProperties:
  #       Minify: true
  #       Target: es2022
  #       EntryPoints:
  #         - handler.ts

  # ── Step Functions ────────────────────────────────────────────────────────

  RDCScraperOrchestrator:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: RDCScraper-Orchestrator
      Definition:
        Comment: 'load_configs -> scrape_parallel -> merge_results -> sync_pipeline -> mark_out_of_stock'
        StartAt: LoadConfigs
        States:
          LoadConfigs:
            Type: Task
            Resource: !GetAtt PipelineLoadConfigsFunction.Arn
            ResultPath: $
            Next: ScrapeParallel

          ScrapeParallel:
            Type: Map
            InputPath: $.spiders
            ItemsPath: $
            MaxConcurrency: 5
            Iterator:
              StartAt: RunSpider
              States:
                RunSpider:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName.$: $.lambda_name
                    Payload:
                      config.$: $.config
                      execution_id.$: $$.Execution.Name
                  ResultSelector:
                    s3_key.$: $.Payload.s3_key
                  End: true
            ResultPath: $.spider_results
            Next: MergeResults

          MergeResults:
            Type: Task
            Resource: !GetAtt PipelineMergeResultsFunction.Arn
            Parameters:
              s3_keys.$: '$.spider_results[*].s3_key'
              execution_id.$: '$$.Execution.Name'
            ResultPath: $.batches
            Next: SyncPipeline

          SyncPipeline:
            Type: Map
            InputPath: $.batches
            ItemsPath: $
            MaxConcurrency: 10
            Iterator:
              StartAt: FindByPath
              States:
                FindByPath:
                  Type: Task
                  Resource: !GetAtt PipelineFindByPathFunction.Arn
                  Parameters:
                    s3_key.$: $.s3_key
                    category.$: $.category
                    sync_token.$: $$.Execution.StartTime
                  Next: SearchDrinks
                SearchDrinks:
                  Type: Task
                  Resource: !GetAtt PipelineSearchDrinksFunction.Arn
                  Next: SyncProduct
                SyncProduct:
                  Type: Task
                  Resource: !GetAtt PipelineSyncProductFunction.Arn
                  End: true
            ResultPath: $.sync_results
            Next: MarkOutOfStock

          MarkOutOfStock:
            Type: Task
            Resource: !GetAtt PipelineMarkOutOfStockFunction.Arn
            Parameters:
              sync_token.$: '$$.Execution.StartTime'
            End: true

      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineLoadConfigsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SpiderJumboFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineMergeResultsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineFindByPathFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineSearchDrinksFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineSyncProductFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineMarkOutOfStockFunction
      Tracing:
        Enabled: true
      Logging:
        Level: ERROR
        IncludeExecutionData: false
