  ########################################
  # STEP FUNCTIONS ORCHESTRATOR
  ########################################

  RDCScraperOrchestrator:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: RDCScraper-Orchestrator
      Definition:
        Comment: 'load_configs -> [migration in progress]'
        StartAt: LoadConfigs
        TimeoutSeconds: 900
        States:
          LoadConfigs:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            OutputPath: $.Payload
            Parameters:
              FunctionName: !Ref PipelineLoadConfigsFunction
              Payload: {}
            Next: ScrapeParallel

          ScrapeParallel:
            Type: Map
            ItemsPath: $.spiders
            MaxConcurrency: 5
            Iterator:
              StartAt: InvokeSpider
              States:
                InvokeSpider:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  OutputPath: $.Payload
                  Parameters:
                    FunctionName.$: $.lambda_name
                    Payload:
                      config.$: $.config
                      execution_id.$: $$.Execution.Name
                  End: true
            Next: MergeResults

          MergeResults:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            OutputPath: $.Payload
            Parameters:
              FunctionName: !Ref PipelineMergeResultsFunction
              Payload:
                s3_keys.$: $
                execution_id.$: $$.Execution.Name
            End: true
          #  Next: SyncPipeline # Uncomment when SyncPipeline is migrated

          # SyncPipeline:
          #   Type: Map
