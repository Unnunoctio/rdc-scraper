          #         Resource: arn:aws:states:::lambda:invoke
          #         OutputPath: $.Payload
          #         Parameters:
          #           FunctionName: !Ref PipelineSearchDrinksFunction
          #           Payload.$: $
          #         Next: SyncProduct
          #       SyncProduct:
          #         Type: Task
          #         Resource: arn:aws:states:::lambda:invoke
          #         OutputPath: $.Payload
          #         Parameters:
          #           FunctionName: !Ref PipelineSyncProductFunction
          #           Payload.$: $
          #         End: true
          #   Next: MarkOutOfStock

          # MarkOutOfStock:
          #   Type: Task
          #   Resource: arn:aws:states:::lambda:invoke
          #   OutputPath: $.Payload
          #   Parameters:
          #     FunctionName: !Ref PipelineMarkOutOfStockFunction
          #     Payload:
          #       sync_token.$: $$.Execution.StartTime
          #   End: true

      Role: !GetAtt RDCScraperOrchestratorRole.Arn

  ########################################
  # IAM ROLES
  ########################################

  RDCScraperOrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFnLambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'

