AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RDC Scraper - Beverage price scraper for Chilean e-commerce sites

Parameters:
  MongoDbUri:
    Type: String
    Description: MongoDB connection string
    NoEcho: true

  MongoDbDatabase:
    Type: String
    Description: MongoDB database name (e.g. dev or prod)

  S3ImagesBucket:
    Type: String
    Description: S3 bucket name for product images
    Default: rincon-del-curao

  # -- Unused until spider integration --
  DrinksApiUrl:
    Type: String
    Description: RDC Drinks API base URL
    Default: ''

  DrinksApiKey:
    Type: String
    Description: RDC Drinks API key
    Default: ''

  ProxyEndpoint:
    Type: String
    Description: Proxy endpoint for Cloudflare bypass
    Default: ''

  ProxyApiKey:
    Type: String
    Description: Proxy API key
    Default: ''

  ResendApiKey:
    Type: String
    Description: Resend API key for email notifications
    Default: ''

  EmailSender:
    Type: String
    Description: Sender email address (must be verified in Resend)
    Default: ''

  EmailRecipient:
    Type: String
    Description: Recipient email for unmatched products report
    Default: ''

Resources:
  ########################################
  # DYNAMO DB - SPIDER CONFIGURATIONS
  ########################################

  SpiderConfigsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RDCScraper-SpiderConfigsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  ########################################
  # S3 BUCKET - PRODUCT IMAGES
  ########################################

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3ImagesBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ProductImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${S3ImagesBucket}/images/*'

  ########################################
  # PIPELINE LAMBDAS
  ########################################

  PipelineLoadConfigsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineLoadConfigsFunction
      CodeUri: dist/pipeline/load-configs
      Handler: handler.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Timeout: 30
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SpiderConfigsTable
      Environment:
        Variables:
          CONFIG_TABLE: !Ref SpiderConfigsTable
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB: !Ref MongoDbDatabase

  ########################################
  # SHARED LAMBDA LAYER
  ########################################

  # SharedUtilsLayer:
  #   Type: AWS::Serverless::LayerVersion
  #   Properties:
  #     LayerName: RDCScraper-SharedUtilsLayer
  #     Description: Shared utilities (BaseSpider, fetchers, ScrapedProduct model)
  #     ContentUri: src/shared/
  #     CompatibleRuntimes:
  #       - python3.14
  #     CompatibleArchitectures:
  #       - arm64

  ########################################
  # SPIDER LAMBDAS
  ########################################

  SpiderJumboFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-SpiderJumboFunction
      CodeUri: dist/spiders/jumbo
      Handler: handler.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Timeout: 300
      MemorySize: 1024
      Policies:
        - S3WritePolicy:
            BucketName: !Ref S3ImagesBucket
      Environment:
        Variables:
          S3_PIPELINE_BUCKET: !Ref S3ImagesBucket
          PROXY_ENDPOINT: !Ref ProxyEndpoint
          PROXY_API_KEY: !Ref ProxyApiKey

  PipelineMergeResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RDCScraper-PipelineMergeResultsFunction
      CodeUri: dist/pipeline/merge-results
      Handler: handler.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Timeout: 30
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3ImagesBucket
      Environment:
        Variables:
          S3_PIPELINE_BUCKET: !Ref S3ImagesBucket

